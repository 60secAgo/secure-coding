{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<h2>로그인</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  사용자명: <input type="text" name="username" maxlength="20" required autofocus><br>
  비밀번호: <input type="password" name="password" maxlength="64" required><br>
  <button type="submit">로그인</button>
</form>
<p style="font-size:13px;color:#888;">※ 로그인 5회 실패 시 5분간 계정이 잠깁니다.</p>
{% endblock %}
